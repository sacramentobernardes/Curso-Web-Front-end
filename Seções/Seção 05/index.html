<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>

    <style>
        
        .flexbox {
            height: 200px;
            border: 2px solid black;
            display: flex;
            margin-bottom: 16px;
        }
        
        .flexbox div {
            width: 100px;
            margin: 20px;
            padding: 20px;
        }

        .flex-conteiner1 {
            flex-flow: row-reverse;
            justify-content: space-evenly;
        }

        .flex-conteiner2 {
            /* flex-direction: row-reverse; */
            justify-content: space-evenly;
            align-items: center;
        }

        .flex-conteiner2 div {
            width: 50px;
        }
        
        .div1 {
            background-color: red;
        }
        
        .div2 {
            background-color: green;
        }

        .div3 {
            background-color: blue;
        }

        .div4 {
            background-color: yellow;
        }
    </style>
</head>
<body>
    
    <div class="flexbox flex-conteiner1">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
    </div>
    
    <div class="flexbox flex-conteiner2">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
    </div>

</body>
</html>
