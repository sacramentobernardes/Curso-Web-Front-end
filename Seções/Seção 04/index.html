<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>

    <style>
        body {
            display: flex;            
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .conteiner {
            border: 2px solid black;
            padding: 16px;
            width: 300px;
            margin-bottom: 16px;            
        }
        
        .conteiner div {
            margin: 20px;
            padding: 20px;
            text-align: center; 
        }
        
        .div1 {
            background-color: red;
        }
        
        .div2 {
            background-color: green;
        }

        .div3 {
            background-color: blue;
        }
    </style>
</head>
<body>
    
    <div class="conteiner">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
    </div>

</body>
</html>
